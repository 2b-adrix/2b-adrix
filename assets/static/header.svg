<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Aditya Kumar Mishra — Native Android &amp; Backend Systems Engineer">
<title>Aditya Kumar Mishra — Native Android &amp; Backend Systems Engineer</title>
<style>
text { font-family: 'Inter', 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; white-space: pre; }
.muted { fill: #94a3b8; } .dim { fill: #64748b; } .accent { fill: #3ddc84; }
.fade { animation: fadeIn .6s ease-out both; }
.pulse { animation: pulseDot 2.6s ease-in-out infinite; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1" fill="#18202c"/>
  </pattern>
  <radialGradient id="topGlow" cx="25%" cy="0%" r="65%">
    <stop offset="0" stop-color="#3ddc84" stop-opacity=".10"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".2"/>
  </linearGradient>
  <clipPath id="frame"><rect x=".5" y=".5" width="999" height="289" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
