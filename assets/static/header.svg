<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" role="img" aria-label="ADITYA MISHRA — Android &amp; Backend Engineer">
<title>ADITYA MISHRA — Android &amp; Backend Engineer</title>
<style>
text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; white-space: pre; }
.muted { fill: #94a3b8; } .dim { fill: #64748b; } .mint { fill: #3ddc84; } .coral { fill: #ff8a4c; }
.fade { animation: fadeIn .8s ease-out both; }
.pulse { animation: pulseDot 2.2s ease-in-out infinite; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.glow { animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(34px,-12px); } }
</style>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c2230" stroke-width="0.8"/>
  </pattern>
  <radialGradient id="gMint" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3ddc84" stop-opacity=".22"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
  <radialGradient id="gCoral" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8a4c" stop-opacity=".18"/><stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/></radialGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc84"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#ff8a4c"/></linearGradient>
  <clipPath id="frame"><rect x=".5" y=".5" width="999" height="343" rx="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1000" height="344" fill="#0c0e12"/>
  <rect width="1000" height="344" fill="url(#grid)" opacity=".75"/>
  <ellipse class="glow" cx="150" cy="80" rx="300" ry="180" fill="url(#gMint)"/>
  <ellipse class="glow" cx="540" cy="290" rx="280" ry="160" fill="url(#gCoral)" style="animation-delay:-6s"/>

  <!-- Top-left HUD badge -->
  <g class="fade">
    <rect x="44" y="34" width="214" height="26" rx="13" fill="#181d29" stroke="#262d3d"/>
    <circle class="pulse" cx="60" cy="47" r="4" fill="#3ddc84"/>
    <text x="72" y="51" class="mono" font-size="10.5" fill="#3ddc84">ANDROID // @2b-adrix · OPEN</text>
    <text x="42" y="120" font-size="52" font-weight="900" letter-spacing="1">ADITYA MISHRA</text>
    <rect x="44" y="132" width="120" height="4" rx="2" fill="url(#nameGrad)"/>
  </g>

  <g class="fade" style="animation-delay:0.20s">
    <text x="44" y="168" font-size="24" font-weight="700" fill="url(#nameGrad)" style="fill:url(#nameGrad)">Android &amp; Backend Engineer</text>
    <text x="44" y="196" font-size="14" class="muted">B.Tech CSE · Mewar University '28 · Alpha-coders</text>
  </g>

  <g class="fade" style="animation-delay:0.40s">
    <rect x="44" y="216" width="4" height="24" rx="2" fill="#ff8a4c"/>
    <text x="58" y="233" font-size="14.5" font-style="italic" fill="#f8fafc">“Engineering products, not just projects.”</text>
  </g>

  <g class="fade" style="animation-delay:0.65s"><rect x="44" y="264" width="68" height="28" rx="14" fill="#181d29" stroke="#262d3d"/><text x="78" y="282" text-anchor="middle" class="mono" font-size="11.5" fill="#f8fafc">Kotlin</text></g><g class="fade" style="animation-delay:0.73s"><rect x="119.8" y="264" width="134" height="28" rx="14" fill="#181d29" stroke="#262d3d"/><text x="187" y="282" text-anchor="middle" class="mono" font-size="11.5" fill="#f8fafc">Jetpack Compose</text></g><g class="fade" style="animation-delay:0.81s"><rect x="261.3" y="264" width="104" height="28" rx="14" fill="#181d29" stroke="#262d3d"/><text x="313" y="282" text-anchor="middle" class="mono" font-size="11.5" fill="#f8fafc">Spring Boot</text></g><g class="fade" style="animation-delay:0.89s"><rect x="373.6" y="264" width="82" height="28" rx="14" fill="#181d29" stroke="#262d3d"/><text x="415" y="282" text-anchor="middle" class="mono" font-size="11.5" fill="#f8fafc">Firebase</text></g><g class="fade" style="animation-delay:0.97s"><rect x="464.0" y="264" width="97" height="28" rx="14" fill="#181d29" stroke="#262d3d"/><text x="512" y="282" text-anchor="middle" class="mono" font-size="11.5" fill="#f8fafc">Clean Arch</text></g>
  
  <g class="fade" style="animation-delay:0.25s">
    <!-- Phone outer chassis -->
    <rect x="668" y="22" width="290" height="300" rx="30" fill="#090c10" stroke="#334155" stroke-width="2"/>
    <rect x="675" y="29" width="276" height="286" rx="24" fill="#12161f" stroke="#262d3d"/>
    <!-- Punch-hole camera & status bar -->
    <circle cx="813" cy="43" r="4.5" fill="#05070a" stroke="#1e293b"/>
    <text x="692" y="47" class="mono muted" font-size="10">9:41</text>
    <text x="934" y="47" text-anchor="end" class="mono mint" font-size="9.5">5G · 100%</text>

    <!-- Material You App Header inside phone -->
    <rect x="688" y="62" width="250" height="68" rx="16" fill="#181d29" stroke="#262d3d"/>
    <!-- Android bugdroid silhouette badge -->
    <rect x="700" y="74" width="44" height="44" rx="12" fill="#3ddc84" fill-opacity=".15" stroke="#3ddc84" stroke-opacity=".4"/>
    <path d="M713,99 a9,9 0 0 1 18,0 Z" fill="#3ddc84"/>
    <line x1="716" y1="86" x2="718" y2="90" stroke="#3ddc84" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="728" y1="86" x2="726" y2="90" stroke="#3ddc84" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="718.5" cy="95" r="1.1" fill="#0c0e12"/>
    <circle cx="725.5" cy="95" r="1.1" fill="#0c0e12"/>

    <text x="756" y="93" font-size="14" font-weight="700" fill="#f8fafc">2b-adrix.apk</text>
    <text x="756" y="110" class="mono mint" font-size="10.5">@Composable UI</text>

    <!-- Live Compose Build Card inside phone -->
    <rect x="688" y="142" width="250" height="106" rx="16" fill="#0c0e12" stroke="#262d3d"/>
    <text x="702" y="163" class="mono coral" font-size="10.5">val stack = listOf(</text>
    <text x="712" y="181" class="mono text" font-size="10.5">"Kotlin + Compose",</text>
    <text x="712" y="199" class="mono text" font-size="10.5">"Spring Boot APIs",</text>
    <text x="712" y="217" class="mono text" font-size="10.5">"Firebase + MongoDB"</text>
    <text x="702" y="235" class="mono coral" font-size="10.5">)</text>

    <!-- Bottom Material Navigation Pill / Build Status -->
    <rect x="688" y="260" width="250" height="36" rx="18" fill="#3ddc84" fill-opacity=".14" stroke="#3ddc84" stroke-opacity=".45"/>
    <circle class="pulse" cx="708" cy="278" r="4.5" fill="#3ddc84"/>
    <text x="722" y="282" class="mono mint" font-size="11" font-weight="700">RELEASE BUILD PASSING</text>
  </g>
</g>
<path d="M22 10 h-12 v12 M978 10 h12 v12 M22 334 h-12 v-12 M978 334 h12 v-12" fill="none" stroke="#3ddc84" stroke-opacity=".45" stroke-width="1.5"/>
<rect x=".5" y=".5" width="999" height="343" rx="22" fill="none" stroke="#262d3d"/>
</svg>
