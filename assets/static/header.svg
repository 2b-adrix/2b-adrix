    <text x="638" y="56" class="mono dim" font-size="10.5" letter-spacing="0.8">ENGINEERING SPEC</text>
    <circle class="pulse" cx="872" cy="52" r="3.5" fill="#3ddc84"/>
    <text x="940" y="56" text-anchor="end" class="mono accent" font-size="10">OPEN TO COLLAB</text>
    <line x1="618" y1="70" x2="960" y2="70" stroke="#1f2937"/>
    <text x="638" y="92" class="mono dim" font-size="10" letter-spacing="0.6">PRIMARY</text><text x="716" y="92" font-size="12.5" font-weight="600" fill="#3ddc84">Kotlin · Jetpack Compose</text><line x1="638" y1="106" x2="940" y2="106" stroke="#18202c"/><text x="638" y="128" class="mono dim" font-size="10" letter-spacing="0.6">SECURITY</text><text x="716" y="128" font-size="12.5" font-weight="600" fill="#f8fafc">TFLite · SQLCipher · Biometrics</text><line x1="638" y1="142" x2="940" y2="142" stroke="#18202c"/><text x="638" y="164" class="mono dim" font-size="10" letter-spacing="0.6">BACKEND</text><text x="716" y="164" font-size="12.5" font-weight="600" fill="#f8fafc">Java · Spring Boot · MongoDB</text><line x1="638" y1="178" x2="940" y2="178" stroke="#18202c"/><text x="638" y="200" class="mono dim" font-size="10" letter-spacing="0.6">FOCUS</text><text x="716" y="200" font-size="12.5" font-weight="600" fill="#f8fafc">Clean Architecture · DSA</text>
    <rect x="638" y="226" width="302" height="22" rx="5" fill="#090c10" stroke="#1f2937"/>
    <text x="789" y="240.5" text-anchor="middle" class="mono dim" font-size="10">“Engineering products, not just projects.”</text>
