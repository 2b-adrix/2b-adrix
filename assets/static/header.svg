    <text x="42" y="96" font-size="40" font-weight="800" letter-spacing="-0.8">Aditya Kumar Mishra</text>
    <text x="44" y="128" font-size="18" font-weight="600" fill="#38bdf8">Native Android &amp; Backend Systems Engineer</text>
  </g>

  <g class="fade" style="animation-delay:0.18s">
    <text x="44" y="162" font-size="13.5" class="muted">Building resilient Jetpack Compose applications, security-first mobile</text>
