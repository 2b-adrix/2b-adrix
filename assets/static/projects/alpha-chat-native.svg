<svg xmlns="http://www.w3.org/2000/svg" width="490" height="168" viewBox="0 0 490 168" role="img" aria-label="REALTIME · MOBILE">
<title>REALTIME · MOBILE</title>
<style>
text { font-family: 'Inter', 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; white-space: pre; }
.muted { fill: #94a3b8; }
.dim { fill: #64748b; }
.accent { fill: #3ddc84; }
.sky { fill: #38bdf8; }
.fade { animation: fadeIn .55s ease-out both; }
.grow { animation: growX .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left center; }
.rise { animation: growY .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center bottom; }
.pulse { animation: pulseDot 2.6s ease-in-out infinite; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
</style>
<defs>
  <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <clipPath id="panelClip"><rect x="0.5" y="0.5" width="489" height="167" rx="14"/></clipPath>
</defs>
<g clip-path="url(#panelClip)">
  <rect width="490" height="168" fill="#090c10"/>
  <rect width="490" height="38" fill="#0e131b"/>
  <line x1="0" y1="38" x2="490" y2="38" stroke="#1f2937"/>
  <circle cx="20" cy="19" r="3.5" fill="#38bdf8"/>
  <text x="32" y="23" class="mono muted" font-size="11" font-weight="600" letter-spacing="0.8">REALTIME · MOBILE</text>
  <text x="470" y="23" text-anchor="end" class="mono dim" font-size="10">VIEW REPO ↗</text>
  <g transform="translate(0 38)">
<text x="20" y="32" font-size="17.5" font-weight="700">Alpha-Chat-Native</text>
<text x="20" y="56" font-size="12.5" class="muted">Native real-time Android messaging client built</text>
<text x="20" y="74" font-size="12.5" class="muted">around Firebase authentication and live sync.</text>
<rect x="20" y="92" width="58" height="21" rx="5" fill="#121822" stroke="#1f2937"/><text x="49" y="106" text-anchor="middle" class="mono muted" font-size="10">Kotlin</text><rect x="83.6" y="92" width="64" height="21" rx="5" fill="#121822" stroke="#1f2937"/><text x="116" y="106" text-anchor="middle" class="mono muted" font-size="10">Android</text><rect x="153.79999999999998" y="92" width="71" height="21" rx="5" fill="#121822" stroke="#1f2937"/><text x="189" y="106" text-anchor="middle" class="mono muted" font-size="10">Firebase</text>
<circle cx="398" cy="102" r="4" fill="#a78bfa"/>
<text x="407" y="106" class="mono dim" font-size="10.5">Kotlin</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="489" height="167" rx="14" fill="none" stroke="#1f2937"/>
