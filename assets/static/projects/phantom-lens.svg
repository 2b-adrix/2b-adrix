<svg xmlns="http://www.w3.org/2000/svg" width="490" height="168" viewBox="0 0 490 168" role="img" aria-label="~/projects/Phantom-Lens">
<title>~/projects/Phantom-Lens</title>
<style>
text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f1f5f9; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; white-space: pre; }
.muted { fill: #94a3b8; }
.dim { fill: #64748b; }
.accent { fill: #22d3ee; }
.accent2 { fill: #a78bfa; }
.ok { fill: #34d399; }
.fade { animation: fadeIn .65s ease-out both; }
.grow { animation: growX .95s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left center; }
.rise { animation: growY .95s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center bottom; }
.pulse { animation: pulseDot 2.4s ease-in-out infinite; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
</style>
<defs>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".35" stop-color="#22d3ee" stop-opacity=".75"/>
    <stop offset=".65" stop-color="#a78bfa" stop-opacity=".75"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="ambientGlow" cx="85%" cy="15%" r="65%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="cardClip"><rect x="0.5" y="0.5" width="489" height="167" rx="12"/></clipPath>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="490" height="168" fill="#070b12"/>
  <rect width="490" height="168" fill="url(#ambientGlow)"/>
  <rect width="490" height="36" fill="#0d131f"/>
  <rect x="0" y="0" width="490" height="1.5" fill="url(#topSheen)"/>
  <line x1="0" y1="36" x2="490" y2="36" stroke="#1e293b"/>
  <circle cx="20" cy="18.0" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="18.0" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="18.0" r="5.5" fill="#28c840"/>
  <text x="76" y="22.0" class="mono muted" font-size="12">~/projects/Phantom-Lens</text>
  <text x="472" y="22.0" text-anchor="end" class="mono dim" font-size="11">open repo ↗</text>
  <g transform="translate(0 36)">
<rect x="0" y="0" width="3.5" height="132" fill="#a78bfa"/>
<text x="20" y="28" font-size="17" font-weight="700">Phantom-Lens</text>
<rect x="336" y="12" width="134" height="20" rx="10" fill="#111927" stroke="#1e293b"/>
<text x="403" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#a78bfa">ANDROID · CAMERA</text>
<text x="20" y="54" font-size="12.5" class="muted">Native Kotlin Android camera &amp; visual utility</text>
<text x="20" y="72" font-size="12.5" class="muted">built around clean MVVM separation of concerns.</text>
<rect x="20" y="94" width="59" height="22" rx="11" fill="#111927" stroke="#1e293b"/><text x="49" y="109" text-anchor="middle" class="mono muted" font-size="10.5">Kotlin</text><rect x="85.8" y="94" width="66" height="22" rx="11" fill="#111927" stroke="#1e293b"/><text x="119" y="109" text-anchor="middle" class="mono muted" font-size="10.5">Android</text><rect x="158.39999999999998" y="94" width="45" height="22" rx="11" fill="#111927" stroke="#1e293b"/><text x="181" y="109" text-anchor="middle" class="mono muted" font-size="10.5">MVVM</text>
<circle cx="404" cy="105" r="4.5" fill="#a97bff"/>
<text x="414" y="109" class="mono dim" font-size="10.5">Kotlin</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="489" height="167" rx="12" fill="none" stroke="#1e293b"/>
