    <rect x="686" y="70" width="38" height="38" rx="10" fill="#3ddc84" fill-opacity=".15" stroke="#3ddc84" stroke-opacity=".45"/>
    <path d="M696,92 a9,9 0 0 1 18,0 Z" fill="#3ddc84"/>
    <circle cx="701.5" cy="88" r="1.1" fill="#0c0e12"/>
    <circle cx="708.5" cy="88" r="1.1" fill="#0c0e12"/>
    <text x="734" y="86" font-size="13.5" font-weight="800">Aditya Kumar Mishra</text>
    <text x="734" y="102" class="mono mint" font-size="9.8">@2b-adrix · CSE '28</text>

    <!-- WHO AM I Profile Card inside Pixel -->
    <rect x="676" y="128" width="260" height="122" rx="14" fill="#0c0e12" stroke="#262d3d"/>
    <text x="690" y="148" class="mono coral" font-size="9.5" font-weight="700" letter-spacing="0.8">WHO AM I</text>
    <text x="690" y="168" font-size="13.5" font-weight="800" fill="#f8fafc">Android &amp; Backend Engineer</text>
    <text x="690" y="189" class="mono mint" font-size="10">· B.Tech CSE · Mewar Univ</text>
    <text x="690" y="206" class="mono mint" font-size="10">· Team Alpha-coders</text>
    <text x="690" y="223" class="mono sky" font-size="10">· Builds Apps &amp; Spring APIs</text>
    <text x="690" y="240" class="mono muted" font-size="10">· App Security &amp; DSA</text>

    <!-- Bottom Status Pill -->
    <rect x="676" y="262" width="260" height="34" rx="17" fill="#3ddc84" fill-opacity=".14" stroke="#3ddc84" stroke-opacity=".5"/>
    <circle class="pulse" cx="694" cy="279" r="4.2" fill="#3ddc84"/>
    <text x="706" y="283" class="mono mint" font-size="10.2" font-weight="700">OPEN TO COLLABORATION</text>
    <polygon points="664,30 804,30 734,316 664,316" fill="url(#phoneGlare)" opacity=".05"/>
  </g>
</g>
<path d="M22 10 h-12 v12 M978 10 h12 v12 M22 338 h-12 v-12 M978 338 h12 v-12" fill="none" stroke="#3ddc84" stroke-opacity=".48" stroke-width="1.5"/>
<rect x=".5" y=".5" width="999" height="347" rx="22" fill="none" stroke="#262d3d"/>
</svg>
