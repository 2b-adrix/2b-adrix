  <g class="fade" style="animation-delay:0.22s">
    <!-- Hardware buttons (power & volume) -->
    <rect x="955" y="94" width="4" height="28" rx="2" fill="#334155"/>
    <rect x="955" y="136" width="4" height="48" rx="2" fill="#334155"/>
    <!-- Pixel Hardware Chassis -->
    <rect x="656" y="22" width="300" height="302" rx="32" fill="#080a0f" stroke="#334155" stroke-width="2"/>
    <rect x="663" y="29" width="286" height="288" rx="25" fill="#12161f" stroke="#262d3d"/>
    <circle cx="806" cy="43" r="4.5" fill="#040609" stroke="#1e293b"/>
    <circle cx="806" cy="43" r="1.5" fill="#38bdf8" fill-opacity=".45"/>
    <text x="680" y="47" class="mono muted" font-size="10">9:41</text>
    <text x="932" y="47" text-anchor="end" class="mono mint" font-size="9.5">5G · INDIA</text>

    <!-- Identity Header inside Pixel -->
