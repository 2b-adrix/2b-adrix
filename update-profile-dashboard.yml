name: Update Profile Dashboard

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile_dashboard.py"
      - ".github/workflows/update-profile-dashboard.yml"

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate account cards and recent activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_USER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      OUTPUT_DIR: ${{ runner.temp }}/profile-cards

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate dashboard SVGs and update activity
        run: python3 scripts/profile_dashboard.py

      - name: Commit README when recent activity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README activity is unchanged."
          else
            git commit -m "chore(readme): refresh recent GitHub activity"
            git push origin HEAD:main
          fi

      - name: Publish generated cards to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.svg' -print -quit)" ]; then
            echo "No SVG cards were generated; refusing to replace the output branch."
            exit 1
          fi

          TEMP_REPO="$RUNNER_TEMP/output-branch"
          mkdir -p "$TEMP_REPO"
          cd "$TEMP_REPO"
          git init
          git checkout --orphan output
          cp "$OUTPUT_DIR"/*.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: refresh profile dashboard cards"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/output
